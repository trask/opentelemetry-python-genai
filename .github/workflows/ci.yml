# The `check` job below is the single aggregate job intended to be the only
# required status check on the main branch. It depends on every workflow
# invoked here; if any job in any of those workflows fails, `check` fails too.
# When adding a new reusable workflow, add it to both `jobs:` and `check.needs:`.

name: CI

on:
  push:
    branches:
    - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Build the test and lint matrices dynamically from `tox -l` so adding a
  # new tox env automatically extends CI without editing workflow YAML.
  prepare:
    name: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test_matrix: ${{ steps.gen.outputs.test_matrix }}
      lint_matrix: ${{ steps.gen.outputs.lint_matrix }}
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Generate matrix JSON from tox -l
        id: gen
        run: |
          uvx --with tox-uv tox -l | python scripts/tox_matrix.py >> "$GITHUB_OUTPUT"

  misc:
    uses: ./.github/workflows/misc.yml
  lint:
    needs: prepare
    uses: ./.github/workflows/lint.yml
    with:
      matrix: ${{ needs.prepare.outputs.lint_matrix }}
  tests:
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      matrix: ${{ needs.prepare.outputs.test_matrix }}

  check:
    if: always()
    needs:
      - prepare
      - misc
      - lint
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
